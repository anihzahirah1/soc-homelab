# /etc/dnsmasq.d/lab.conf on rtr01
# DHCP for the Clients network and DNS for the whole lab
interface=enp0s8
interface=enp0s9
bind-interfaces
domain-needed
bogus-priv
domain=lab.local
host-record=rtr01.lab.local,10.10.10.1
host-record=srv01.lab.local,10.10.10.10
dhcp-range=enp0s9,10.10.20.100,10.10.20.200,12h
# Upstream DNS: forward names dnsmasq doesn't know to VirtualBox's NAT DNS
no-resolv
server=10.0.2.3
# DHCP reservation: kali01 always gets 10.10.20.10
dhcp-host=08:00:27:5A:87:BC,kali01,10.10.20.10
