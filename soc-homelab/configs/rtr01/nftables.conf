#!/usr/sbin/nft -f
# /etc/nftables.conf on rtr01: default-deny firewall + NAT
flush ruleset

define WAN     = "enp0s3"
define SERVERS = "enp0s8"
define CLIENTS = "enp0s9"
define SRV01   = 10.10.10.10

table inet filter {

  # Traffic TO the router itself
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept                                   # the router talking to itself
    ct state established,related accept               # replies to connections already allowed
    ct state invalid drop
    iifname $WAN udp sport 67 udp dport 68 accept     # the router's own DHCP lease from VirtualBox
    iifname { $SERVERS, $CLIENTS } udp dport { 53, 67 } accept   # DNS and DHCP for the lab
    iifname { $SERVERS, $CLIENTS } tcp dport 53 accept
    iifname $CLIENTS tcp dport 22 accept              # SSH admin to the router from the Clients network
    icmp type echo-request accept                     # allow ping, useful for troubleshooting
    log prefix "NFT-IN-DROP: " drop                   # log, then drop, everything else
  }

  # Traffic THROUGH the router, between networks
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname $CLIENTS oifname $SERVERS ip daddr $SRV01 tcp dport { 22, 80 } accept   # web and SSH to srv01 only
    iifname $CLIENTS oifname $SERVERS ip daddr $SRV01 icmp type echo-request accept
    # UPDATES: remove the # on the next line while you update, then put it back
    # iifname { $SERVERS, $CLIENTS } oifname $WAN accept
    log prefix "NFT-FWD-DROP: " drop
  }

  # Traffic FROM the router itself: allowed
  chain output {
    type filter hook output priority 0; policy accept;
  }
}

# NAT: lab addresses leave the router as its WAN address
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname $WAN masquerade
  }
}
