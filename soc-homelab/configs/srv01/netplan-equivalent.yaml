# srv01 network settings (entered in the Ubuntu installer).
# This is the equivalent netplan configuration.
network:
  version: 2
  ethernets:
    enp0s3:
      addresses: [10.10.10.10/24]
      routes:
        - to: default
          via: 10.10.10.1
      nameservers:
        addresses: [10.10.10.1]
        search: [lab.local]
